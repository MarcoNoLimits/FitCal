<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 78% 30%, #13324a 0%, #0F172A 55%);
    font-family: "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    color: #F8FAFC;
    display: flex; align-items: center;
  }
  /* Keep everything inside Play's safe area: centred, away from the edges. */
  .wrap { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 84px; box-sizing: border-box; }
  .left { max-width: 470px; }
  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 26px; }
  .brand svg { width: 76px; height: 76px; border-radius: 18px; }
  .brand span { font-size: 54px; font-weight: 700; letter-spacing: -1.5px; }
  h1 { margin: 0 0 14px; font-size: 40px; line-height: 1.12; font-weight: 700; letter-spacing: -0.8px; }
  h1 em { font-style: normal; color: #34D399; }
  p { margin: 0; font-size: 21px; line-height: 1.4; color: #94A3B8; }

  .card {
    width: 330px; background: #F8FAFC; color: #0F172A; border-radius: 22px; padding: 24px 26px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.35);
  }
  .meal { font-size: 15px; color: #64748B; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .kcal { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 18px; }
  .kcal b { font-size: 48px; letter-spacing: -1.5px; }
  .kcal span { font-size: 18px; color: #64748B; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-size: 16px; font-weight: 600; }
  .row .lbl { width: 70px; color: #334155; }
  .bar { flex: 1; height: 10px; background: #E2E8F0; border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 6px; }
  .row .g { width: 46px; text-align: right; font-family: "JetBrains Mono", Consolas, monospace; font-size: 15px; color: #0F172A; }
  .items { margin-top: 18px; padding-top: 14px; border-top: 1px solid #E2E8F0; font-size: 14px; color: #64748B; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: #ECFDF5; color: #047857; border-radius: 999px; padding: 4px 10px; font-weight: 600; }
</style></head>
<body>
<div class="wrap">
  <div class="left">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
        <rect width="108" height="108" fill="#0F172A"/>
        <path fill="#10B981" d="M40.5,28 A6.5,6.5 0 0,1 47,34.5 V73.5 A6.5,6.5 0 0,1 34,73.5 V34.5 A6.5,6.5 0 0,1 40.5,28 Z"/>
        <path fill="#60A5FA" d="M40.5,28 H69.5 A6.5,6.5 0 0,1 69.5,41 H40.5 A6.5,6.5 0 0,1 40.5,28 Z"/>
        <path fill="#FBBF24" d="M40.5,48 H57.5 A6.5,6.5 0 0,1 57.5,61 H40.5 A6.5,6.5 0 0,1 40.5,48 Z"/>
        <path fill="#10B981" d="M40.5,28 A6.5,6.5 0 1,1 40.49,28 Z"/>
        <path fill="#34D399" d="M72,68 A6,6 0 1,1 71.99,68 Z"/>
      </svg>
      <span>FitCal</span>
    </div>
    <h1>Snap a meal.<br><em>See the macros.</em></h1>
    <p>Calorie and macro estimates from one photo. Edit any portion and the totals update.</p>
  </div>

  <!-- Illustrative example only, not a real scan result. -->
  <div class="card">
    <div class="meal">Chicken &amp; rice bowl</div>
    <div class="kcal"><b>592</b><span>kcal</span></div>
    <div class="row"><span class="lbl">Protein</span><div class="bar"><i style="width:74%;background:#10B981"></i></div><span class="g">48g</span></div>
    <div class="row"><span class="lbl">Carbs</span><div class="bar"><i style="width:82%;background:#60A5FA"></i></div><span class="g">64g</span></div>
    <div class="row"><span class="lbl">Fat</span><div class="bar"><i style="width:38%;background:#FBBF24"></i></div><span class="g">16g</span></div>
    <div class="items"><span class="chip">Chicken 180g</span><span class="chip">Rice 200g</span><span class="chip">Broccoli 90g</span></div>
  </div>
</div>
</body></html>
